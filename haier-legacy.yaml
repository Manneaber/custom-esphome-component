esphome:
  name: ac_sala

esp8266:
  board: d1_mini

# Repackaged Haier custom climate class as a local external component.
# The folder structure is: components/haier_legacy/{__init__.py,climate.py,haier.h}
external_components:
  - source:
      type: local
      path: components
    components: [haier_legacy]

logger:
  level: DEBUG
  baud_rate: 0 #Important: frees the hardware UART (GPIO1/GPIO3) for the AC

# The AC talks over the hardware UART0 (TX=GPIO1, RX=GPIO3) at 9600 baud.
uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #important, otherwise the IP could change and then the entity is unavailable from home assistant.
  manual_ip:
    static_ip: 192.168.1.32
    gateway: 192.168.1.1
    subnet: 255.255.255.0
# Enable Home Assistant API
api:

ota:


climate:
  - platform: haier_legacy
    name: "ac sala"